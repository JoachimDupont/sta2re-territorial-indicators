name: Identify Walloon border communes

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/identify_border_communes.py"
      - "requirements.txt"
      - ".github/workflows/identify-border-communes.yml"

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Identify communes
        run: python scripts/identify_border_communes.py
      - name: Upload GeoJSON and CSV
        uses: actions/upload-artifact@v4
        with:
          name: communes-wallonie-frontiere-france
          path: |
            data/reference/communes_wallonie_frontiere_france.geojson
            data/reference/communes_wallonie_frontiere_france.csv
