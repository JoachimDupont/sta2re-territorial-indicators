name: Build STA²RE study-area municipality reference

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/identify_border_communes.py"
      - "requirements.txt"
      - "docs/methodologie_icu.md"
      - ".github/workflows/identify-border-communes.yml"

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build municipality reference
        run: python scripts/identify_border_communes.py
      - name: Upload GeoJSON and CSV
        uses: actions/upload-artifact@v4
        with:
          name: communes-zone-etude-icu
          path: |
            data/reference/communes_zone_etude_icu.geojson
            data/reference/communes_zone_etude_icu.csv
