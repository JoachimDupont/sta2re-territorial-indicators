name: Experimental rail noise - Tournai

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/test_rail_noise_tournai.py"
      - "scripts/download_rail_noise_source.py"
      - ".github/workflows/test-rail-noise-tournai.yml"

permissions:
  contents: read

concurrency:
  group: sta2re-rail-noise-tournai-experiment
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare Tournai study inputs
        run: |
          python scripts/identify_border_communes.py
          python scripts/prepare_statbel_inputs.py
      - name: Restore rail GeoPackage cache
        id: rail-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/noise/rail_noise_2022.gpkg
          key: sta2re-noise-gpkg-v1-${{ runner.os }}
      - name: Download official rail GeoPackage if cache missed
        run: python scripts/download_rail_noise_source.py
      - name: Calculate experimental Tournai rail exposure
        run: python scripts/test_rail_noise_tournai.py
      - name: Upload experimental results (not published to website)
        uses: actions/upload-artifact@v4
        with:
          name: rail-noise-tournai-experimental
          path: |
            data/experimental/rail_noise_tournai_sectors_2026.geojson
            data/experimental/rail_noise_tournai_qa_2026.json
          if-no-files-found: error
          retention-days: 30
