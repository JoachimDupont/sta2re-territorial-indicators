name: Inspect and stage STA2RE ICU source data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_icu_sources.py"
      - ".github/workflows/inspect-icu-sources.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build municipality reference
        run: python scripts/identify_border_communes.py
      - name: Download and inspect official sources
        run: python scripts/inspect_icu_sources.py
      - name: Upload source inputs and schema report
        uses: actions/upload-artifact@v4
        with:
          name: sta2re-icu-source-inspection
          path: |
            data/raw/statbel_sectors_2026_31370.geojson.zip
            data/raw/statbel_population_by_sector_2026.xlsx
            data/raw/*.geojson
            data/interim/source_schema_report.json
            data/reference/communes_zone_etude_icu.geojson
          if-no-files-found: error
