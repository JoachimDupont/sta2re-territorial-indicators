name: Experimental forest-fire exposure - Tournai

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/test_fire_tournai.py"
      - "scripts/calculate_hazard_exposure.py"
      - ".github/workflows/test-fire-tournai.yml"

permissions:
  contents: write

concurrency:
  group: sta2re-fire-tournai-experiment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare Tournai study inputs
        run: |
          python scripts/identify_border_communes.py
          python scripts/prepare_statbel_inputs.py
      - name: Restore official fire-probability source cache
        id: fire-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/awac_fire_probability_31370.zip
          key: sta2re-awac-fire-probability-2025-v1-${{ runner.os }}
      - name: Calculate experimental Tournai forest-fire exposure
        run: python scripts/test_fire_tournai.py
      - name: Save official fire source cache
        if: steps.fire-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw/awac_fire_probability_31370.zip
          key: ${{ steps.fire-cache.outputs.cache-primary-key }}
      - name: Publish Tournai forest-fire data without replacing existing indicators
        run: |
          mkdir -p site/data
          cp data/experimental/fire_exposure_tournai_communes_2026.geojson site/data/
          cp data/experimental/fire_exposure_tournai_quartiers_2026.geojson site/data/
          cp data/experimental/fire_exposure_tournai_sectors_2026.geojson site/data/
          cp data/experimental/fire_exposure_tournai_qa_2026.json site/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/fire_exposure_tournai_*
          if ! git diff --cached --quiet; then
            git commit -m "Publish experimental Tournai forest-fire indicators [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Upload Tournai forest-fire results
        uses: actions/upload-artifact@v4
        with:
          name: fire-tournai-results
          path: |
            data/experimental/fire_exposure_tournai_communes_2026.geojson
            data/experimental/fire_exposure_tournai_quartiers_2026.geojson
            data/experimental/fire_exposure_tournai_sectors_2026.geojson
            data/experimental/fire_exposure_tournai_qa_2026.json
          if-no-files-found: error
          retention-days: 30
