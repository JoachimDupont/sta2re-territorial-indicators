name: Calculate STA2RE ICU exposure indicators

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/calculate_icu_exposure.py"
      - "scripts/calculate_hazard_exposure.py"
      - "scripts/calculate_noise_exposure.py"
      - ".github/workflows/calculate-icu-exposure.yml"

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build fixed 29-commune study area
        run: python scripts/identify_border_communes.py
      - name: Download and inspect official source data
        run: python scripts/inspect_icu_sources.py
      - name: Calculate ICU exposure indicators
        run: python scripts/calculate_icu_exposure.py
      - name: Calculate forest-fire and flood exposure indicators
        run: python scripts/calculate_hazard_exposure.py
      - name: Calculate strategic road and rail noise exposure
        run: python scripts/calculate_noise_exposure.py
      - name: Publish GeoJSON to the website
        run: |
          mkdir -p site/data
          cp data/processed/icu_exposure_sectors_2026.geojson site/data/
          cp data/processed/icu_exposure_quartiers_2026.geojson site/data/
          cp data/processed/icu_exposure_communes_2026.geojson site/data/
          cp data/interim/icu_exposure_qa_2026.json site/data/
          cp data/processed/fire_exposure_sectors_2026.geojson site/data/
          cp data/processed/fire_exposure_quartiers_2026.geojson site/data/
          cp data/processed/fire_exposure_communes_2026.geojson site/data/
          cp data/processed/flood_exposure_sectors_2026.geojson site/data/
          cp data/processed/flood_exposure_quartiers_2026.geojson site/data/
          cp data/processed/flood_exposure_communes_2026.geojson site/data/
          cp data/interim/hazard_exposure_qa_2026.json site/data/
          cp data/processed/noise_exposure_sectors_2026.geojson site/data/
          cp data/processed/noise_exposure_quartiers_2026.geojson site/data/
          cp data/processed/noise_exposure_communes_2026.geojson site/data/
          cp data/interim/noise_exposure_qa_2026.json site/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if ! git diff --cached --quiet; then
            git commit -m "Publish ICU indicator data [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Upload GeoJSON, CSV and QA report
        uses: actions/upload-artifact@v4
        with:
          name: sta2re-territorial-hazard-exposure-2026
          path: |
            data/processed/icu_exposure_sectors_2026.geojson
            data/processed/icu_exposure_sectors_2026.csv
            data/processed/icu_exposure_quartiers_2026.geojson
            data/processed/icu_exposure_quartiers_2026.csv
            data/processed/icu_exposure_communes_2026.geojson
            data/processed/icu_exposure_communes_2026.csv
            data/interim/icu_exposure_qa_2026.json
            data/processed/fire_exposure_sectors_2026.geojson
            data/processed/fire_exposure_sectors_2026.csv
            data/processed/fire_exposure_quartiers_2026.geojson
            data/processed/fire_exposure_quartiers_2026.csv
            data/processed/fire_exposure_communes_2026.geojson
            data/processed/fire_exposure_communes_2026.csv
            data/processed/flood_exposure_sectors_2026.geojson
            data/processed/flood_exposure_sectors_2026.csv
            data/processed/flood_exposure_quartiers_2026.geojson
            data/processed/flood_exposure_quartiers_2026.csv
            data/processed/flood_exposure_communes_2026.geojson
            data/processed/flood_exposure_communes_2026.csv
            data/interim/hazard_exposure_qa_2026.json
            data/processed/noise_exposure_sectors_2026.geojson
            data/processed/noise_exposure_sectors_2026.csv
            data/processed/noise_exposure_quartiers_2026.geojson
            data/processed/noise_exposure_quartiers_2026.csv
            data/processed/noise_exposure_communes_2026.geojson
            data/processed/noise_exposure_communes_2026.csv
            data/interim/noise_exposure_qa_2026.json
          if-no-files-found: error
