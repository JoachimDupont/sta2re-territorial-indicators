name: Calculate STA2RE territorial exposure indicators

on:
  workflow_dispatch:
    inputs:
      indicator:
        description: "Indicateur à recalculer (les autres résultats sont conservés)"
        required: true
        type: choice
        default: noise
        options:
          - noise
          - hazards
          - icu
          - all
  push:
    paths:
      - "scripts/calculate_icu_exposure.py"
      - "scripts/calculate_hazard_exposure.py"
      - "scripts/calculate_noise_exposure.py"
      - "scripts/prepare_statbel_inputs.py"
      - ".github/workflows/calculate-icu-exposure.yml"

concurrency:
  group: sta2re-territorial-indicators-download-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build fixed 29-commune study area
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]') || contains(github.event.head_commit.message, '[run-hazards]')
        run: python scripts/identify_border_communes.py
      - name: Download and inspect official ICU source data
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'icu' || inputs.indicator == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-indicators]'))
        run: python scripts/inspect_icu_sources.py
      - name: Prepare Statbel geometry and population inputs
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'noise' || inputs.indicator == 'hazards')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-noise]') || contains(github.event.head_commit.message, '[run-hazards]')))
        run: python scripts/prepare_statbel_inputs.py
      - name: Calculate ICU exposure indicators
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'icu' || inputs.indicator == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-indicators]'))
        run: python scripts/calculate_icu_exposure.py
      - name: Calculate forest-fire and flood exposure indicators
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'hazards' || inputs.indicator == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-indicators]'))
        run: python scripts/calculate_hazard_exposure.py
      - name: Restore official noise GeoPackages cache
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'noise' || inputs.indicator == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]')))
        id: noise-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/noise/*.gpkg
          key: sta2re-noise-gpkg-v1-${{ runner.os }}
      - name: Download official road and rail noise GeoPackages
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'noise' || inputs.indicator == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]')))
        run: python scripts/download_noise_sources.py
      - name: Save official noise GeoPackages cache
        if: always() && steps.noise-cache.outputs.cache-hit != 'true' && hashFiles('data/raw/noise/*.gpkg') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/noise/*.gpkg
          key: sta2re-noise-gpkg-v1-${{ runner.os }}
      - name: Calculate strategic road and rail noise exposure
        if: (github.event_name == 'workflow_dispatch' && (inputs.indicator == 'noise' || inputs.indicator == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]')))
        run: python scripts/calculate_noise_exposure.py
      - name: Publish generated GeoJSON files without replacing other indicators
        if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]') || contains(github.event.head_commit.message, '[run-hazards]')))
        run: |
          mkdir -p site/data
          for file in \
            icu_exposure_sectors_2026.geojson icu_exposure_quartiers_2026.geojson icu_exposure_communes_2026.geojson \
            fire_exposure_sectors_2026.geojson fire_exposure_quartiers_2026.geojson fire_exposure_communes_2026.geojson \
            flood_exposure_sectors_2026.geojson flood_exposure_quartiers_2026.geojson flood_exposure_communes_2026.geojson \
            noise_exposure_sectors_2026.geojson noise_exposure_quartiers_2026.geojson noise_exposure_communes_2026.geojson; do
            if [ -f "data/processed/$file" ]; then cp "data/processed/$file" site/data/; fi
          done
          for file in icu_exposure_qa_2026.json hazard_exposure_qa_2026.json noise_exposure_qa_2026.json; do
            if [ -f "data/interim/$file" ]; then cp "data/interim/$file" site/data/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if ! git diff --cached --quiet; then
            git commit -m "Publish selected territorial indicators [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Upload generated GeoJSON and QA reports
        if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-indicators]') || contains(github.event.head_commit.message, '[run-noise]') || contains(github.event.head_commit.message, '[run-hazards]')))
        uses: actions/upload-artifact@v4
        with:
          name: sta2re-territorial-indicators-2026
          path: |
            data/processed/*exposure*.geojson
            data/processed/*exposure*.csv
            data/interim/*exposure*qa*.json
          if-no-files-found: ignore
